<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaLand — Хэллоуин донат дүкені</title>
<meta name="theme-color" content="#0a0610">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rubik:wght@400;500;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0610;--bg2:#140c1e;--bg3:#1d1129;--bone:#f1e8d4;--mut:#b2a5c6;--pk:#ff7a1a;--em:#ffb347;--tox:#8dff3a;--bl:#e0344a;--line:rgba(255,160,70,.24);--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scrollbar-color:#6b3a16 var(--bg)}
body{font:400 16px/1.6 Rubik,system-ui,sans-serif;background:var(--bg);color:var(--bone);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 520px at 85% -5%,rgba(108,59,209,.30),transparent 60%),radial-gradient(700px 500px at 0 100%,rgba(255,122,26,.10),transparent 60%);pointer-events:none}
#lamp{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(280px circle at var(--mx,50%) var(--my,30%),rgba(255,150,50,.12),transparent 70%)}
::selection{background:var(--pk);color:#1a0b00}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#6b3a16;border-radius:9px}::-webkit-scrollbar-track{background:var(--bg)}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--em);outline-offset:3px;border-radius:6px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:10px clamp(14px,4vw,40px);background:rgba(10,6,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:400 1.8rem/1 'Pirata One',serif;letter-spacing:.5px;color:var(--bone)}
.brand .ic{color:var(--pk);width:1.4em;height:1.4em}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 13px;text-decoration:none;color:var(--mut);font-weight:500;font-size:.92rem;white-space:nowrap;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a:hover{color:var(--bone)}nav a.on{color:var(--em);border-color:var(--pk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:0;border-radius:10px;background:var(--pk);color:#1a0b00;font-weight:700;text-decoration:none;transition:transform .15s,background .2s;box-shadow:0 6px 18px rgba(255,122,26,.28)}
.btn:hover{background:var(--em);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--pk);color:var(--em)}
.btn.sm{padding:8px 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:wait}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(14px,4vw,40px)}
/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .scene{position:absolute;inset:auto 0 0 0;width:100%;height:100%;opacity:.95}
.hero-in{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:start;padding:clamp(40px,8vw,90px) 0 clamp(150px,22vw,260px)}
.hero h1{font:400 clamp(4rem,12vw,9rem)/.9 'Pirata One',serif;text-shadow:0 8px 40px rgba(255,122,26,.4)}
.hero h2{font:400 clamp(1.5rem,3.2vw,2.5rem)/1.15 'Rubik Wet Paint',Rubik,sans-serif;color:var(--pk);margin:18px 0 12px}
.hero p{max-width:46ch;color:var(--mut);margin-bottom:24px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.sign{justify-self:center;position:relative;width:min(280px,70vw);padding-top:70px;transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
.sign i{position:absolute;top:0;width:2px;height:74px;background:repeating-linear-gradient(#8a7a66 0 6px,transparent 6px 9px)}
.sign i:first-child{left:22%}.sign i:nth-child(2){right:22%}
.plank{display:grid;gap:2px;text-align:center;padding:22px 18px;border-radius:10px;background:linear-gradient(160deg,#3a2112,#24130a);border:2px solid #5b351c;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.plank b{font:400 clamp(4rem,9vw,5.6rem)/1 'Pirata One',serif;color:var(--pk)}
.plank span{font-size:.9rem;color:var(--em);font-weight:500}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
/* info */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:-60px 0 56px;position:relative}
.cell{padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.cell small{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.82rem}
.cell small .ic{color:var(--pk)}
.cell strong{display:block;font-size:1.25rem;margin-top:4px;word-break:break-all}
.cell em{font-style:normal;color:var(--mut);font-size:.82rem}
/* pages */
.page{padding:44px 0 80px}
.ph{margin-bottom:28px}
.ph h1{font:400 clamp(2.2rem,5vw,3.6rem)/1.05 'Rubik Wet Paint',Rubik,sans-serif;color:var(--pk)}
.ph p{color:var(--mut);max-width:60ch;margin-top:8px}
.seg{display:inline-flex;gap:4px;padding:4px;margin-bottom:30px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.seg button{padding:9px 20px;border:0;background:none;border-radius:8px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--pk);color:#1a0b00;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:22px}
.stone{--c:#ff7a1a;position:relative;display:flex;flex-direction:column;padding:26px 20px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--bg3)),var(--bg2) 55%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:110px 110px 14px 14px;transition:transform .2s,border-color .2s}
.stone:hover{transform:translateY(-5px);border-color:var(--c)}
.stone .seal{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 10px;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,#0a0610);border:1px solid var(--c);color:var(--c);font-size:1.7rem}
.stone h3{text-align:center;font:400 2rem/1 'Pirata One',serif;color:var(--c);letter-spacing:.5px}
.stone ul{list-style:none;margin:14px 0 8px;display:grid;gap:5px;font-size:.88rem}
.stone li{display:flex;gap:8px;align-items:center;color:var(--bone)}
.stone li .ic{color:var(--c);width:1em;height:1em}
.stone .ex{font-size:.8rem;color:var(--mut);margin-bottom:14px;flex:1}
.pr{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.pr s{color:var(--mut);font-size:.9rem}
.pr b{font-size:1.5rem;font-weight:700}
.off{position:absolute;top:14px;right:12px;padding:2px 8px;border-radius:6px;background:var(--bl);font-size:.75rem;font-weight:700;color:#fff}
.sub{display:flex;align-items:center;gap:10px;margin:34px 0 16px;font:400 1.9rem/1 'Pirata One',serif}
.sub .ic{color:var(--pk)}
.item{display:flex;flex-direction:column;gap:6px;padding:22px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.item .seal{width:46px;height:46px;font-size:1.3rem;margin:0 0 6px;display:grid;place-items:center;border-radius:12px;background:rgba(255,122,26,.12);color:var(--pk)}
.item h3{font-size:1.1rem}.item p{color:var(--mut);font-size:.88rem;flex:1}
.calc{max-width:560px;padding:28px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.calc input{width:100%;padding:14px 16px;margin:14px 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--bone);font:700 1.6rem Rubik}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.presets button{padding:7px 14px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--mut)}
.presets button:hover{border-color:var(--pk);color:var(--em)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;color:var(--mut)}
.tot b{font:400 2.4rem/1 'Pirata One',serif;color:var(--pk)}
/* faq + rules */
details{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary .ic{transition:transform .2s;color:var(--pk)}details[open] summary .ic{transform:rotate(180deg)}
.ans{padding:0 20px 18px;color:var(--mut);max-width:70ch}
.ans ol{padding-left:20px;display:grid;gap:6px}.ans b{color:var(--em)}
.faqw{max-width:820px}
.rule{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,160,70,.12)}
.rule:last-child{border:0}.rule code{font:500 .85rem Rubik;color:var(--mut)}
.tag{padding:4px 10px;border-radius:7px;font-size:.8rem;font-weight:500;background:rgba(255,179,71,.12);color:var(--em);text-align:right}
.tag.hard{background:rgba(224,52,74,.16);color:#ff8a98}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow:hidden}
.box h2{padding:14px 18px;font:400 1.6rem/1 'Pirata One',serif;background:var(--bg3);border-bottom:1px solid var(--line)}
.warn{display:flex;gap:12px;padding:16px 18px;border:1px dashed var(--bl);border-radius:var(--r);color:var(--mut)}
.warn .ic{color:var(--bl);width:1.4em;height:1.4em;margin-top:2px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:.85rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
/* modal */
#ov{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:16px;background:rgba(5,2,10,.82)}
#ov.open{display:grid}
.mod{width:min(460px,100%);max-height:92vh;overflow:auto;padding:26px;background:var(--bg2);border:1px solid var(--pk);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:pop .25s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h2{font:400 1.9rem/1 'Pirata One',serif}
.x{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:none;border-radius:10px}
.dots{display:flex;gap:6px;margin-bottom:18px}.dots i{flex:1;height:4px;border-radius:4px;background:var(--bg3)}.dots i.on{background:var(--pk)}
.mod label{display:grid;gap:6px;margin:14px 0;font-size:.88rem;color:var(--mut)}
.mod input[type=text]{padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--bone);font:500 1rem Rubik}
.mod .btn{width:100%}.mod .row{display:flex;gap:10px;margin-top:16px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:grid;gap:2px;padding:10px 6px;border:1px solid var(--line);background:none;border-radius:10px;font-size:.82rem;color:var(--mut)}
.chip b{color:var(--bone);font-size:.95rem}.chip.on{border-color:var(--pk);background:rgba(255,122,26,.12)}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;margin:12px 0;background:var(--bg);border:1px dashed var(--em);border-radius:12px;font:700 1.15rem Rubik;letter-spacing:1px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--mut);text-align:center}
.drop:hover{border-color:var(--pk)}.drop input{display:none}
.rate{display:flex;gap:6px;justify-content:center;margin:12px 0 18px}
.rate button{border:0;background:none;color:var(--mut);font-size:1.7rem}.rate button.on{color:var(--pk)}
.done{text-align:center}.done .big{width:70px;height:70px;margin:0 auto 12px;display:grid;place-items:center;border-radius:50%;background:rgba(141,255,58,.12);color:var(--tox);font-size:2rem}
#toast{position:fixed;left:50%;bottom:24px;z-index:200;display:flex;gap:8px;align-items:center;padding:12px 18px;background:var(--bg3);border:1px solid var(--pk);border-radius:10px;transform:translate(-50%,90px);transition:transform .3s cubic-bezier(.16,1,.3,1)}
#toast.show{transform:translate(-50%,0)}
@media(max-width:820px){.hero-in{grid-template-columns:1fr}.sign{order:-1;margin-bottom:-10px}.top{gap:8px}.brand span{display:none}.info{margin-top:-40px}.rule{grid-template-columns:40px 1fr}.rule .tag{grid-column:2;justify-self:start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 ['Сервер ережелерін бұзсам не болады?','Ереже бұзғанда уақытша немесе тұрақты бан қолданылады. Тыйым салынса, <b>Разбан</b> қызметін сатып ала аласыз.'],
 ['Серверге қалай қосылуға болады?',`<b>Java:</b> мекенжайға <b>${JAVA_IP}</b> жазыңыз, нұсқа 1.21.x<br><b>Bedrock:</b> IP <b>${JAVA_IP}</b>, порт <b>${BEDROCK_PORT}</b>, нұсқа 1.26+`],

 ['ІІ бөлім · Ойын процесі',[['2.1','Чит / Макрос / Модтар қолдану','Бан 25 күн, қайталанса IP-BAN'],['2.2','Читті мойындап кетірсе','Бан 10 күн'],['2.3','Чит қолданушымен бір командада ойнау','Бан 10 күн'],['2.5','Дюп (заттарды көбейту)','Мәңгілік бан + қара тізім',1],['2.6','Лаг-машина немесе зиянды механизмдер','Мәңгілік бан',1],['2.7','Аккаунт сату / беру / бұзу','IP-BAN',1],['2.8','Әкімшілікке немесе медиаға кедергі жасау','Бан 30 минут'],['2.9','Балағат никпен ойнау','Ескерту / мәңгілік бан'],['3.0','Тексеруден (проверка) қашу','Бан 30 күн']]]
];
/* ===== КӨМЕКШІЛЕР ===== */
const $=s=>document.querySelector(s), fmt=n=>Number(n).toLocaleString('ru-RU'), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
let per=0, goldAmt=100, tt;
function toast(m){$('#tm').textContent=m;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m||'Көшірілді')).catch(()=>toast('Көшіру мүмкін болмады'))}
/* ===== БЕТТЕР ===== */
const SCENE=`<svg class="scene" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><radialGradient id="mg"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient></defs>
<circle cx="930" cy="120" r="170" fill="url(#mg)"/><circle cx="930" cy="120" r="62" fill="#ffe7bf"/><circle cx="912" cy="104" r="9" fill="#efca93"/><circle cx="950" cy="140" r="13" fill="#efca93"/><circle cx="940" cy="98" r="5" fill="#efca93"/>
<g fill="#05030a"><path d="M0 400V330c80-14 150-4 230-18s160-8 240 4 120 14 200 0 140-10 220 2 150 10 310-6v88z"/>
<path d="M120 330V240l22-16v-34l10-18 10 18v34l24 18v90zM240 330v-70l30-24 30 24v70zM380 330v-96h70v96z"/>
<path d="M610 330V196l34-26v-48l12-24 12 24v48l30 20 30-20v-40l10-26 10 26v40l34 26v134z"/>
<path d="M1010 330V268h26v-24h20v24h26v62zM60 330c10-30 8-60 0-92M60 262l-26-22M60 282l22-26M60 250l16-30"/></g>
<g fill="#ff9a2e"><rect x="656" y="206" width="14" height="22" rx="2"/><rect x="702" y="206" width="14" height="22" rx="2"/><rect x="679" y="252" width="16" height="26" rx="8"/><rect x="140" y="252" width="9" height="14" rx="2"/><rect x="262" y="268" width="9" height="14" rx="2"/></g>
<g fill="#05030a"><path id="b" d="M0 0c6-9 14-9 20 0 6-9 14-9 20 0-6-3-10 1-20 8-10-7-14-11-20-8z" transform="translate(300 90) scale(1.2)"/><use href="#b" transform="translate(190 60) scale(.8)"/><use href="#b" transform="translate(560 40) scale(1.5)"/><use href="#b" transform="translate(800 190) scale(.9)"/></g></svg>`;
function home(){return `<section class="hero">${SCENE}<div class="wrap hero-in"><div>
<h1>NovaLand</h1><h2>Хэллоуин түні келді</h2>
<p>Привилегиялар, кейстер мен алтынға 20% жеңілдік. Қараңғы түн біткенше ғана жұмыс істейді, сондықтан тезірек үлгеріңіз.</p>
<div class="acts"><a class="btn" href="#/donates">${ic('crown')}Донаттарды қарау</a><button class="btn ghost" data-copy="${JAVA_IP}">${ic('copy')}IP көшіру</button></div></div>
<div class="sign" aria-label="20% жеңілдік"><i></i><i></i><div class="plank"><span>Хэллоуин жеңілдігі</span><b>−20%</b><span>барлық донатқа</span></div></div></div></section>
<div class="wrap"><div class="info">
<div class="cell"><small>${ic('cube')}Java IP</small><strong>${JAVA_IP}</strong><em>Нұсқа 1.21.4+</em></div>
<div class="cell"><small>${ic('cube')}Bedrock IP</small><strong>${JAVA_IP}</strong><em>Нұсқа 1.26+</em></div>
<div class="cell"><small>${ic('net')}Bedrock порт</small><strong>${BEDROCK_PORT}</strong><em>UDP протоколы</em></div>
<div class="cell"><small>${ic('send')}Қолдау</small><strong>@${TG}</strong><em>Telegram профиль</em></div></div></div>`}
const head=(t,p)=>`<div class="ph"><h1>${t}</h1><p>${p}</p></div>`;
function rankCards(){return R.map((r,i)=>`<article class="stone" style="--c:${r.c}"><span class="off">−20%</span><div class="seal">${ic(r.ic)}</div><h3>${r.n}</h3>
<ul>${r.cmds.slice(0,3).map(c=>`<li>${ic('check')}${c}</li>`).join('')}</ul><p class="ex">${r.ex}</p>
<div class="pr"><b>${fmt(r.p[per])} ₸</b><s>${fmt(r.o[per])} ₸</s></div><button class="btn" data-buy="rank:${i}">${ic('cart')}Сатып алу</button></article>`).join('')}
function donates(){return `<div class="wrap page">${head('Привилегиялар','Мерзімді таңдаңыз: бағалар барлық карточкада бірден өзгереді. Барлығында 20% жеңілдік бар.')}
<div class="seg" role="tablist">${PL.map((l,i)=>`<button role="tab" class="${i==per?'on':''}" data-per="${i}">${l}</button>`).join('')}</div><div class="grid" id="rg">${rankCards()}</div></div>`}
function caseCards(t){const c=CASES[t];return c.l.map((x,i)=>`<article class="stone" style="--c:${t=='d'?'#ff7a1a':'#f5c842'};border-radius:var(--r)"><span class="off">−20%</span><div class="seal">${ic(c.ic)}</div><h3>${c.n} ${x[0]}×</h3><div class="ex" style="margin-top:14px"></div><div class="pr"><b>${fmt(x[1])} ₸</b><s>${fmt(x[2])} ₸</s></div><button class="btn" data-buy="case:${t}:${i}">${ic('cart')}Сатып алу</button></article>`).join('')}
function cases(){return `<div class="wrap page">${head('Кейстер','Сирек заттар мен сыйлықтар. Кейстерге де 20% жеңілдік.')}<div class="sub">${ic('gem')}Донат кейстер</div><div class="grid">${caseCards('d')}</div><div class="sub">${ic('coins')}Алтын кейстер</div><div class="grid">${caseCards('g')}</div></div>`}
function golds(){return `<div class="wrap page">${head('Алтын сатып алу','Серверлік валюта: 1 алтын = '+GOLD_RATE+' ₸.')}<div class="calc"><label for="ga" style="color:var(--mut)">Қанша алтын керек?</label><input id="ga" type="number" min="1" inputmode="numeric" value="${goldAmt}">
<div class="presets">${[100,500,1000,2500,5000,10000].map(v=>`<button data-gp="${v}">${fmt(v)}</button>`).join('')}</div>
<div class="tot"><span><span id="gn">${fmt(goldAmt)}</span> алтын</span><b><span id="gp">${fmt(goldAmt*GOLD_RATE)}</span> ₸</b></div><button class="btn" data-buy="gold">${ic('cart')}Сатып алу</button></div></div>`}
function others(){return `<div class="wrap page">${head('Қосымша қызметтер','Арнайы қызметтер мен параметрлер.')}<div class="grid">${OTHERS.map((o,i)=>`<article class="item"><div class="seal">${ic(o.ic)}</div><h3>${o.n}</h3><p>${o.d}</p><div class="pr"><b>${fmt(o.p)} ₸</b></div><button class="btn" data-buy="other:${i}">${ic('cart')}Сатып алу</button></article>`).join('')}</div></div>`}
function faq(){return `<div class="wrap page faqw">${head('Сұрақ-жауап','Жиі қойылатын сұрақтар мен нұсқаулықтар.')}${FAQ.map(f=>`<details><summary>${f[0]}${ic('chev')}</summary><div class="ans">${f[1]}</div></details>`).join('')}<div class="acts" style="margin-top:22px"><a class="btn" target="_blank" rel="noopener" href="https://t.me/${TG}">${ic('send')}Telegram-да жазу</a></div></div>`}
function rules(){return `<div class="wrap page faqw">${head('Ережелер','Серверде ойнамас бұрын барлық ережелерді оқып шығыңыз.')}${RULES.map(s=>`<section class="box"><h2>${s[0]}</h2>${s[1].map(r=>`<div class="rule"><code>${r[0]}</code><span>${r[1]}</span><span class="tag ${r[3]?'hard':''}">${r[2]}</span></div>`).join('')}</section>`).join('')}<div class="warn">${ic('alert')}<p>Модерация ескертусіз жаза қолдануға құқылы. Барлық ойыншылар, тіпті донат иелері де ережеге бағынады. Бұзушылықты байқасаңыз, хабарлаңыз: @tornado437</p></div></div>`}
const PAGES={home,donates,cases,golds,others,faq,rules};
function route(){const k=location.hash.replace(/^#\/?/,'')||'home',p=PAGES[k]?k:'home';$('#view').innerHTML=PAGES[p]();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));scrollTo(0,0)}
addEventListener('hashchange',route);route();
/* ===== САТЫП АЛУ ===== */
let M=null;
const cost=()=>M.rank!=null?R[M.rank].p[M.per]:M.price;
function buy(k){const [t,a,b]=k.split(':');
 if(t=='rank')M={name:R[a].n,rank:+a,per};
 else if(t=='case'){const x=CASES[a].l[b];M={name:`${CASES[a].n} ${x[0]}×`,price:x[1]}}
 else if(t=='other')M={name:OTHERS[a].n,price:OTHERS[a].p};
 else{const g=Math.max(1,parseInt($('#ga').value)||1);M={name:'Алтын',gold:g,price:g*GOLD_RATE}}
 M.step=1;M.nick='';M.file=null;M.rate=0;$('#ov').classList.add('open');draw()}
function closeM(){$('#ov').classList.remove('open')}
function draw(){const dots=`<div class="dots">${[1,2,3].map(i=>`<i class="${i<=M.step?'on':''}"></i>`).join('')}</div>`;
 const hd=t=>`<div class="mh"><h2>${t}</h2><button class="x" data-close aria-label="Жабу">${ic('x')}</button></div>`;let b='';
 if(M.step==1)b=`${hd(esc(M.name)+(M.gold?' · '+fmt(M.gold):''))}${dots}${M.rank!=null?`<div class="chips">${R[M.rank].p.map((p,i)=>`<button class="chip ${i==M.per?'on':''}" data-mper="${i}">${PL[i]}<b>${fmt(p)} ₸</b></button>`).join('')}</div>`:`<div class="tot"><span>Төленетін сома</span><b>${fmt(cost())} ₸</b></div>`}
<label>Ойын НИК-нейміңіз<input type="text" id="nick" value="${esc(M.nick)}" placeholder="Steve123" autocomplete="off"></label><button class="btn" data-go="2">Жалғастыру</button>`;
 else if(M.step==2)b=`${hd('Төлем')}${dots}<p style="color:var(--mut);font-size:.9rem">1. Kaspi-ден <b style="color:var(--em)">${fmt(cost())} ₸</b> аударыңыз:</p><div class="card"><span>${CARD.replace(/(\d{4})(?=\d)/g,'$1 ')}</span><button class="btn sm" data-copy="${CARD}">${ic('copy')}Көшіру</button></div>
<p style="color:var(--mut);font-size:.9rem;margin-bottom:10px">2. Скриншот немесе PDF чекті жүктеңіз:</p><label class="drop">${ic('up')}<span id="fn">${M.file?esc(M.file.name):'Файлды таңдаңыз · PNG, JPG, PDF · 10MB'}</span><input type="file" id="file" accept="image/*,.pdf"></label>
<div class="row"><button class="btn ghost" data-go="1" style="width:40%">Артқа</button><button class="btn" id="ok" data-go="3">Растау</button></div>`;
 else b=`${hd('Дайын')}${dots}<div class="done"><div class="big">${ic('check')}</div><p style="color:var(--mut)">Мәліметтер жіберілді. Модерация тексергеннен кейін <b style="color:var(--em)">1–4 сағат ішінде</b> донатыңыз беріледі.</p>
<p style="margin-top:16px;font-size:.9rem">Пікір қалдырыңыз:</p><div class="rate">${[1,2,3,4,5].map(i=>`<button data-rate="${i}" class="${i<=M.rate?'on':''}" aria-label="${i}">${ic('flame')}</button>`).join('')}</div><a class="btn" target="_blank" rel="noopener" href="https://t.me/${TG}">${ic('send')}Telegram-да хабарласу</a></div>`;
 $('#mod').innerHTML=b;const n=$('#nick');if(n)n.focus()}
async function tg(text,file){for(const id of CHAT_IDS){try{if(file){const f=new FormData();f.append('chat_id',id);f.append('caption',text);f.append('parse_mode','HTML');const pdf=file.type=='application/pdf';f.append(pdf?'document':'photo',file);await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${pdf?'sendDocument':'sendPhoto'}`,{method:'POST',body:f})}else await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:id,text,parse_mode:'HTML'})})}catch(e){console.warn('TG',e)}}}
async function submit(){const d=new Date().toLocaleString('kk-KZ',{timeZone:'Asia/Almaty',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
 const cap=`<b>NOVALAND: ЖАҢА ТАПСЫРЫС</b>\n\nНик: <b>${esc(M.nick)}</b>\nДонат: <b>${esc(M.name)}${M.rank!=null?' ('+PL[M.per]+')':''}</b>\n`+(M.gold?`Алтын: <b>${M.gold} дана</b>\n`:'')+`Сумма: <b>${cost()} ₸</b> (Хэллоуин −20%)\nКүні: ${d}`;await tg(cap,M.file)}
/* ===== ОҚИҒАЛАР ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-buy],[data-per],[data-gp],[data-copy],[data-close],[data-mper],[data-go],[data-rate]');
 if(e.target.id=='ov'){closeM();return}if(!t)return;const d=t.dataset;
 if(d.buy)buy(d.buy);
 else if(d.per!==undefined){per=+d.per;document.querySelectorAll('.seg button').forEach((b,i)=>b.classList.toggle('on',i==per));$('#rg').innerHTML=rankCards()}
 else if(d.gp){$('#ga').value=d.gp;calcG()}
 else if(d.copy)copy(d.copy,d.copy==CARD?'Карта нөмірі көшірілді':'Көшірілді: '+d.copy);
 else if('close' in d)closeM();
 else if(d.mper!==undefined){M.nick=$('#nick').value;M.per=+d.mper;draw()}
 else if(d.go){if(M.step==1)M.nick=$('#nick').value.trim();
  if(d.go==2&&!M.nick){toast('Ник-нейміңізді жазыңыз');return}
  if(d.go==3){if(!M.file){toast('Төлем чегін жүктеңіз');return}t.disabled=true;submit();}
  M.step=+d.go;draw()}
 else if(d.rate){M.rate=+d.rate;draw();tg(`<b>Пікір:</b> ${M.rate}/5 (${esc(M.nick)})`)}
});
document.addEventListener('input',e=>{if(e.target.id=='ga')calcG()});
document.addEventListener('change',e=>{if(e.target.id=='file'&&e.target.files[0]){M.file=e.target.files[0];$('#fn').textContent=M.file.name}});
function calcG(){goldAmt=Math.max(0,parseInt($('#ga').value)||0);$('#gn').textContent=fmt(goldAmt);$('#gp').textContent=fmt(goldAmt*GOLD_RATE)}
addEventListener('keydown',e=>{if(e.key=='Escape')closeM();if(e.key=='Enter'&&e.target.id=='nick')document.querySelector('[data-go="2"]').click()});
if(matchMedia('(pointer:fine)').matches)addEventListener('pointermove',e=>{const s=document.documentElement.style;s.setProperty('--mx',e.clientX+'px');s.setProperty('--my',e.clientY+'px')},{passive:true});
</script>
