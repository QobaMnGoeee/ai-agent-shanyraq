<style>
:root{--paper:#F9FBFD;--frost:#E4EEF6;--ice:#B9D1E4;--glacier:#6F98B8;--ink:#13273B;--berry:#B23A48;--gold:#C79A2E;--e:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:repeating-radial-gradient(circle at 14% 22%,transparent 0 26px,rgba(111,152,184,.14) 26px 27px),repeating-radial-gradient(circle at 88% 70%,transparent 0 34px,rgba(111,152,184,.12) 34px 35px)}

#links{display:flex;gap:4px}

.build{padding-top:90px;padding-bottom:100px}

@keyframes pop{from{transform:scale(.4)}}
#bd.night{background:radial-gradient(1.5px 1.5px at 12% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 38% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 9%,#fff,transparent),radial-gradient(1px 1px at 52% 26%,#fff,transparent),linear-gradient(#0B1826,#1E3A57)}

.rule{position:absolute;z-index:2;left:10px;top:120px;bottom:30%;width:18px;opacity:.4;background:repeating-linear-gradient(to bottom,var(--ink) 0 1px,transparent 1px 12px) left/9px 100% no-repeat,repeating-linear-gradient(to bottom,var(--ink) 0 1.5px,transparent 1.5px 60px) left/18px 100% no-repeat}

.sign{position:absolute;top:104px;right:clamp(16px,4vw,32px);width:min(270px,44vw);display:grid;gap:10px;justify-items:center;padding:24px 22px 20px;text-align:center;font-weight:600;line-height:1.3;color:var(--paper);background:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(255,255,255,.1) 33px 34px),var(--ink);border-radius:12px;outline:1.5px dashed var(--ice);outline-offset:-9px;box-shadow:0 24px 30px -18px rgba(19,39,59,.6);transform-origin:50% -104px;animation:sway 7s ease-in-out infinite}

.band{position:relative;z-index:2;background:var(--ink);color:var(--paper);overflow:hidden;padding:16px 0;border-block:1.5px solid var(--ink)}

.ladder{display:flex;align-items:flex-end;gap:6px;margin-top:44px}
.st{flex:1;min-width:0;min-height:calc(132px + var(--i)*50px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 12px;text-align:left;border:1.5px solid var(--ink);border-top:7px solid var(--c);border-radius:14px 14px 0 0;background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(19,39,59,.07) 9px 10px),#fff;transition:transform .45s var(--e),background-color .3s,color .3s}

.ord{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:40px}

.pay{margin-top:56px}

.rs{margin-top:40px}

}

#bg{display:grid}
#links{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;flex-direction:column;padding:10px;background:var(--paper);border:1.5px solid var(--ink);border-radius:24px}

.ladder{flex-direction:column;align-items:flex-start;gap:8px}

}
@media (max-width:520px){

$("#bg").addEventListener("click",e=>{const o=$("#links").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",String(o))});
$("#getc").addEventListener("click",()=>{st.sel="CASE";go("donate");renderOrder();setTimeout(()=>$("#order").scrollIntoView({behavior:"smooth",block:"center"}),80)});
addEventListener("hashchange",()=>show(page()));addEventListener("popstate",()=>show(page()));

const hero=$("#hero"),gs=$$("#ridge g");
hero.addEventListener("pointermove",e=>{
const r=hero.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
hero.style.setProperty("--mx",x+"px");hero.style.setProperty("--my",y+"px");
const n=x/r.width-.5;gs.forEach(g=>g.style.transform=`translateX(${-n*g.dataset.k}px)`)});

const strip=$("#strip"),rl=$("#rl");let busy=false;
strip.innerHTML=Array.from({length:8},()=>RK.map(r=>`<div class="it" style="--c:${r[3]}"><i data-lucide="${r[2]}"></i><b>${r[0]}</b></div>`).join("")).join("");
$("#spin").addEventListener("click",()=>{
if(busy)return;busy=true;$("#res").textContent="";
strip.style.transition="none";strip.style.transform="translateX(0)";void strip.offsetWidth;
const k=Math.floor(Math.random()*7),x=(4*7+k)*120+60-rl.clientWidth/2+(Math.random()-.5)*70;
strip.style.transition="transform 4.6s cubic-bezier(.08,.75,.12,1)";strip.style.transform=`translateX(${-x}px)`;
setTimeout(()=>{$("#res").textContent=`${t().won}: ${RK[k][0]}`;busy=false},4700)});

const cv=$("#snow"),cx=cv.getContext("2d");
let W,H,fl=[],mx=-999,my=-999,dp=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dp;cv.height=H*dp;cx.setTransform(dp,0,0,dp,0,0);
const n=Math.min(220,Math.round(W*H/7000));
while(fl.length<n)fl.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3.2,s:.4+Math.random(),p:Math.random()*6.28,v:0});
fl.length=n}
addEventListener("resize",size);size();
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
addEventListener("pointerleave",()=>{mx=my=-999});
addEventListener("pointerdown",e=>fl.forEach(f=>{const dx=f.x-e.clientX,dy=f.y-e.clientY,d=Math.hypot(dx,dy)||1;if(d<220)f.v+=dx/d*(1-d/220)*7}));
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
(function loop(){
cx.clearRect(0,0,W,H);
for(const f of fl){
f.p+=.012;f.x+=Math.sin(f.p)*.45+f.v;f.v*=.94;f.y+=f.s*(.55+f.r*.25);
const dx=f.x-mx,dy=f.y-my,d=Math.hypot(dx,dy);
if(d<120&&d>0){f.v+=dx/d*(1-d/120)*1.4;f.y+=dy/d*(1-d/120)*1.2}
if(f.y>H+6){f.y=-6;f.x=Math.random()*W}
if(f.x>W+6)f.x=-6;if(f.x<-6)f.x=W+6;
if(f.r>2.5){const L=f.r*2.4;cx.save();cx.translate(f.x,f.y);cx.rotate(f.p*.6);cx.beginPath();for(let k=0;k<3;k++){cx.rotate(1.0472);cx.moveTo(-L,0);cx.lineTo(L,0)}cx.strokeStyle="rgba(111,152,184,.9)";cx.lineWidth=1.2;cx.stroke();cx.restore()}
else{cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fillStyle="rgba(255,255,255,.95)";cx.fill();cx.strokeStyle="rgba(111,152,184,.6)";cx.lineWidth=.8;cx.stroke()}}
requestAnimationFrame(loop)})()}

const SAMPLE=["................","............W...","....SSSS...WWW..","...SSSSSS.WWWWW.","..SSIISSSS..W...",".TSSS..SSST.W...","..SSS..SSS..W...","SSSSSSSSSSSSSSSS","PPPPPPPPPPPPPPPP"];
let g=[],cur=1,paint=1,down=false;
const bd=$("#bd");
function loadS(){g=SAMPLE.join("").split("").map(c=>"SIPWT".indexOf(c)+1)}
function drawB(){bd.innerHTML=g.map((v,i)=>`<i data-n="${i}"${v?` class="b${v}"`:""}></i>`).join("")}
function setCell(n){const v=paint?cur:0;if(g[n]===v)return;g[n]=v;bd.children[n].className=v?`b${v} pop`:""}
function renderPal(){$("#pal").innerHTML=t().bl.map((n,i)=>`<button class="pb" data-b="${i+1}" aria-pressed="${cur===i+1}"><i class="sw b${i+1}"></i>${n}</button>`).join("")}
bd.addEventListener("pointerdown",e=>{const c=e.target.closest("[data-n]");if(!c)return;e.preventDefault();down=true;const n=+c.dataset.n;paint=g[n]===cur?0:1;setCell(n)});
bd.addEventListener("pointermove",e=>{if(!down)return;const c=document.elementFromPoint(e.clientX,e.clientY);if(c&&c.dataset&&c.dataset.n!==undefined)setCell(+c.dataset.n)});
addEventListener("pointerup",()=>{down=false});
addEventListener("pointercancel",()=>{down=false});
const inField=x=>{const n=x.nodeType===3?x.parentNode:x;return n&&n.closest&&n.closest("input,textarea")};
["selectstart","contextmenu","dragstart"].forEach(k=>document.addEventListener(k,e=>{if(!inField(e.target))e.preventDefault()}));
["gesturestart","gesturechange","gestureend","dblclick"].forEach(k=>document.addEventListener(k,e=>e.preventDefault()));
addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","_","0"].includes(e.key))e.preventDefault()});
function scene(){
const r=(a,b)=>a+Math.random()*(b-a);
const tree=(x,y,w,h)=>`M${x-w} ${y}L${x-w*.45} ${y-h*.45}L${x-w*.7} ${y-h*.45}L${x-w*.25} ${y-h*.75}L${x-w*.45} ${y-h*.75}L${x} ${y-h}L${x+w*.45} ${y-h*.75}L${x+w*.25} ${y-h*.75}L${x+w*.7} ${y-h*.45}L${x+w*.45} ${y-h*.45}L${x+w} ${y}Z`;
let a="",b="";
for(let x=-20;x<1480;x+=r(34,52))a+=tree(x,332,r(14,20),r(55,85));
for(let x=-10;x<1480;x+=r(70,120))b+=tree(x,344,r(20,28),r(85,130));
$("#pines").innerHTML=`<path fill="#8FB0CB" d="${a}"/><path fill="#3F6A94" d="${b}"/>`;
let c="M0 0H1440V30";
for(let x=1440;x>0;){const w=r(12,32),h=r(16,56);x-=w;c+=`L${x+w*.5} ${30+h}L${x} 30`}
$("#ice").innerHTML=`<path fill="#fff" stroke="#B9D1E4" stroke-width="1.2" d="${c}Z"/>`}
loadS();drawB();scene();renderLadder();applyLang();show(page());
</script>
